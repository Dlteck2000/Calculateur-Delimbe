<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Réglage Delimbe T5 / T24 / T28</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8" />
  <link rel="stylesheet" href="w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="script.js" defer></script>
</head>
<body class="w3-light-grey">

<div class="w3-container w3-dark-grey w3-center">
  <h1>Réglage Delimbe</h1>
  <h2>Anti-limaces T5 &bull; T24 &bull; T28</h2>
</div>

<div class="w3-row-padding w3-margin-top">

  <!-- Colonne gauche : Configuration -->
  <div class="w3-half w3-margin-bottom">
    <div class="w3-card w3-white">
      <div class="w3-container w3-blue-gray">
        <h3><i class="fa fa-sliders"></i> Configuration</h3>
      </div>
      <div class="w3-container w3-padding">

        <p>
          <label><i class="fa fa-truck w3-text-red"></i> <b>Modèle</b></label>
          <select id="modeleDelimbe" class="w3-select w3-border w3-round" onchange="onButton()">
            <option value="T5">Modèle T5 (Réglage flasque - 3 à 10m)</option>
            <option value="T24">Modèle T24 (Plateau 230 mm - Max 24m)</option>
            <option value="T28">Modèle T28 (Plateau 275 mm - Max 28m)</option>
          </select>
        </p>

        <p>
          <label><i class="fa fa-arrows-h w3-text-blue"></i> <b>Largeur (m)</b></label>
          <input id="largeurDelimbe" class="w3-input w3-border w3-round" type="number" step="0.1" value="8">
        </p>

        <p>
          <label><i class="fa fa-tachometer w3-text-amber"></i> <b>Vitesse (Km/h)</b></label>
          <input id="vitesseDelimbe" class="w3-input w3-border w3-round" type="number" step="0.1" value="10">
        </p>

        <p>
          <label><i class="fa fa-shopping-basket w3-text-green"></i> <b>Dose (Kg/Ha)</b></label>
          <input id="doseDelimbe" class="w3-input w3-border w3-round" type="number" step="0.1" value="5">
        </p>

        <p>
          <label><i class="fa fa-cube w3-text-purple"></i> <b>Densité</b></label>
          <input id="densiteDelimbe" class="w3-input w3-border w3-round" type="number" step="0.01" value="1.0">
        </p>

        <button onclick="onButton()" class="w3-button w3-blue-gray w3-block w3-round w3-margin-top w3-margin-bottom">
          <i class="fa fa-calculator"></i> CALCULER ET SAUVEGARDER
        </button>

      </div>
    </div>
  </div>

  <!-- Colonne droite : Résultats -->
  <div class="w3-half">
    <div class="w3-card w3-white">
      <div class="w3-container w3-green">
        <h3><i class="fa fa-check-circle"></i> Réglages</h3>
      </div>
      <div class="w3-container w3-padding">

        <p><i class="fa fa-map-o w3-text-green"></i> <span id="resHaHeure">...</span></p>
        <p><i class="fa fa-balance-scale w3-text-blue"></i> <span id="resKgHeure">...</span></p>

        <div class="w3-panel w3-pale-green w3-leftbar w3-border-green">
          <p><i class="fa fa-th-list w3-text-green"></i> <b>Ouverture Trappe :</b><br>
          <span id="resOuverture" class="w3-xxlarge w3-text-green"><b>-</b></span></p>
        </div>

        <!-- Message limite largeur : affiché uniquement pour le T5 -->
        <div id="blocLargeurT5" class="w3-panel w3-pale-yellow w3-leftbar w3-border-yellow" style="display:none;"></div>

        <!-- Bloc potentiomètre : affiché uniquement pour T24 et T28 -->
        <div id="blocPotentiometre" class="w3-panel w3-pale-blue w3-leftbar w3-border-blue">
          <p><i class="fa fa-cog w3-text-blue"></i> <b>Potentiomètre Largeur (0-30) :</b><br>
          <span id="resPotentiometre" class="w3-xxlarge w3-text-blue"><b>-</b></span></p>
        </div>

      </div>
      <div class="w3-container w3-light-grey w3-small w3-padding">
        <i class="fa fa-clock-o"></i> Dernière mise à jour : <span id="dateCalcul">aucune</span>
      </div>
    </div>
  </div>

</div>

<!-- Tableau de référence des débits -->
<div class="w3-container w3-margin-top">
  <div class="w3-card w3-white w3-responsive">
    <table class="w3-table-all">
      <thead>
        <tr class="w3-light-grey">
          <th>N° Ouverture</th>
          <th>Standard (d=1.0)</th>
          <th class="w3-blue">Réel avec densité (Kg/h)</th>
        </tr>
      </thead>
      <tbody id="tableBodyDelimbe"></tbody>
    </table>
  </div>
</div>

<br>
</body>
</html>
